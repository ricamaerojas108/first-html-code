<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusHub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo"><span class="white-text">Campus</span>Hub</div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Courses</a>
            <a href="#">Contact</a>
        </nav>
        <div class="dark-mode-toggle">
            <span>Dark mode</span>
            <label class="switch">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider round"></span>
            </label>
        </div>
    </header>

    <main>
        <section class="profile-card">
            <div class="avatar">RR</div>
            <h2>Rica Mae Rojas</h2>
            <p class="subtitle">BS Information Technology, 4th Year</p>
            <div class="badges">
                <span class="badge">HTML</span>
                <span class="badge">CSS</span>
                <span class="badge">JavaScript</span>
            </div>
            <div class="actions">
                <button id="likeBtn">♥ Like <span id="likeCount">24</span></button>
                <button id="resetBtn">Reset</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CampusHub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
